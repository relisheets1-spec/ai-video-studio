# nginx для AI Video Studio БЕЗ домена и Cloudflare — временный режим на голом IP.
# Ставится server-setup.sh, когда домен ещё не передан; после подключения
# Cloudflare заменяется на nginx.conf (TLS, только диапазоны Cloudflare).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Референс — до 8 МБ, плюс запас на границы multipart.
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Кадры и озвучка — прямо с диска, мимо Node.
    location /media/ {
        alias /var/lib/studio/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /_next/static/ {
        alias /var/www/studio/current/.next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Приложение читает адрес только из X-Real-IP; клиентские
        # X-Forwarded-For и CF-Connecting-IP затираем — их можно подделать.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;

        # Сценарий на 15 минут пишется несколько минут — короткий таймаут
        # обрывал бы генерацию на середине.
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }
}
