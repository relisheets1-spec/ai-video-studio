# nginx для AI Video Studio.
# Скопировать в /etc/nginx/sites-available/studio, заменить DOMAIN и включить:
#   ln -sf /etc/nginx/sites-available/studio /etc/nginx/sites-enabled/studio
#   rm -f /etc/nginx/sites-enabled/default && nginx -t && systemctl reload nginx


server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    # Ubuntu 24.04 ставит nginx 1.24: директивы «http2 on» там ещё нет.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name DOMAIN;

    # Сертификат Let's Encrypt — server-setup.sh кладёт ссылки в /etc/ssl/studio.
    ssl_certificate     /etc/ssl/studio/fullchain.pem;
    ssl_certificate_key /etc/ssl/studio/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Референс — до 8 МБ, плюс запас на границы multipart.
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Кадры и озвучка — прямо с диска, мимо Node.
    location /media/ {
        alias /var/lib/studio/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /_next/static/ {
        alias /var/www/studio/current/.next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Приложение верит только X-Real-IP, который ставит nginx.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Сценарий на 15 минут пишется несколько минут — короткий таймаут
        # обрывал бы генерацию на середине.
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }
}
